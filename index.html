         <section id="setup beach gear">
            <h2>Setup Beach Gear for Fishing Season
            </h2>
            <div class="row">
            <div class="section_discription--setup">
                <div class="section_discription--setup--wrapper">
                    <p class="section_discription---setup--para"></p>
                    <p> At the beginning of the season, totes are moved around and sorted to which running lines, ropes 
                        (hall back line, 2=safetys, 2-block ropes, extra rope line) needed for each fishing nets site. 
                        2-Blocks mounted on boards, screw anchors, 4-bouys (3 orange, 1 white), snatch block (block used to pull
                        lines in and out for the net-the pin is never set on the ground, it is always put back in the slot), 
                        spreader bars, corks lines, are set up. Next, the running line is pulled from the up river post through the outside 
                        screw anchors block, to the side steak block and back to shore to the down river post. Extra line is figured 8 high on bank in two piles and 
                        then flipped over so the rope feeds from the top and 2 large rocks are placed on the ropes so the tide doesn't take them out. The snatch block is hung on the post with the pin locked.
                        Spreader bars are tied together by upriver post.
                    </p>
                </div>
                <figure class="setup_img--wrapper">
                    <img src="./assets/setup.jpg" alt="Setup Beach Gear">
                </figure>
            </div>

        <section id="Fishing">
            <h2>Fishing the Nets and Beach.</h2>
            <div class="row">
            <div class="section_discription--fishing:">
                <div class="section_discription--fishing--wrapper">
                    <p class="section_discription---fishig--para"></p>
                    <p> Fishing with the nets, boats, income and out go tide on beach. These are general ideas of procedures.
                        Setting up the net and set time:
                        The cork line is tied to the upriver part of the spreader bar where the orange bouy is attached. Corks are always flaked
                        to the upriver side and lead to the downriver side.
                        The lead line is attached to the downriver part of the spreader bar.
                        Spreader bars are attached together with net between and released when time to set.
                        Downriver post has safetys on and released slowly so the safetys will tighten up, then the post knot is taken off, placed
                        though the snatch block, pulled up on for the correct angle and tied to the tractor or truck. Once attached to the tractor or truck
                        and are getting ready to set, the safetys on the downriver post are removed carefully keeping fingers/ hands from wrapping around rope. 
                        Hands/ fingers MUST NEVER wrap around the rope and is held by the fingers so the rope is about to slip out without wrapping hands/fingers.
                        Once the running line is attached to the tractor or tuck the area from the running line, to the tractor or truck is call the triangle of death.
                        which means you are NEVER to be in this area due to safety. You also Never stand over any rope at anytime.
                        Upriver post safetys are taken off and post knot is untied to the correct amount of loops and ready to feed out and
                        must be held on to once untied.
                        One person will untie the spreaders down to the last part and help until time to set. At that time it is released so the net can feather
                        out.
                        Announced on the radio will be about how many minutes before set time. We set at set time, NOT before.
                        Radio tractor or truck on about how much is left to pull out and stop then when it is at the correct placement.
                        Once net is at the correct placement, upriver post is tied off imedently and safetys are put on.
                        Downriver safetys are put on imedently, and once untied from the tractor or truck the post is tied off. Snatch block is moved
                        over to the upriver post.
                        Then the upriver post with the safetys on is untied slowly to be sure the safetys hold put through the snatch block, pulled up on
                        so the angle is correct and then tied to the tractor or truck. Once tied to the tractor or truck it will pull up on the running line
                        and the safteys are removed slowly.
                        Then lines are figured 8 on the piles.

                        Boat and Picking from Boat:
                        Everyone who is in the boat MUST have a life jacket on, correctly fitted, and buckled before you get on the boat. Life jackets need
                        to be worn under rain coat/gear to prevent from catching on net.

                        Income and Out Go Tide Beach Duty:
                        Income starts as soon as the nets are in the water. (Don't leave until your person for out go is there.)
                        Things to be done:
                        -pick fish as the tide comes in about every 30 to hour or more when the fish are in
                        -bleed, put in sled, covered with wet brailler and a little water. If hot, put in brailer in trailer about brought up top
                        to be iced
                        -help move nets when needed
                        Out go starts at lack water.
                        Things to be done:
                        -pick fish as tide goes out about every 30 to hour or more when the fish are in
                        -bleed, put in sled, covered with wet brailler and a little water. If hot, put in brailer in trailer about brought up top
                        to be iced, if close to pulling just cover
                        -help move nets when needed
                        -Help pull

                        Pulling in or out the boat and 4-wheeler:
                        At all times the 4-wheeler MUST be driven slowly, carefully, in low gear (on the beach), check with riders that
                        they are ready. 
                        To bring the boat in to shore: (You want the boat (dog) to follow you into shore)
                        Untie safety on boat line.
                        Hook up the pullie to the boat line rope next to the downriver block. As you slowly in super low, 
                        4x4, watching the boat and person out meeting the boat pull the boat in, but Don't let it get grounded. Once at correct
                        depth, unhook pullie from 4-wheeler and tied it on correctly to the rack. Then park the 4-wheeler high on the bank.
                        To pull the boat out: (You want the boat (dog) to push it out)
                        Hook up the pullie to the boat line rope next to the upriver block. As you slowly in super low, 4x4, watching the 
                        boat and person watching to be sure it is pulled out far enough. Once out far enough, unhook pullie, tie it correctly
                        to the rack. Put safety on boat line, hook up tailer if there is one.

                        Boat:
                        Everyone helps carry out gas boat tanks, roller motor gas, spotlight, etc.
                        One person holds the boat to be sure it doesn't get grounded while the other get in and:
                        1. Pull the bouy over the bow of the boat and keep it there, un clip the locking caribbeans/ clips (retighten the caribbeans/clips closed 
                        to keep mud and dirt out)or untie the 2 ropes and coil the ropes in the bow (front) of the boat so they won't get tangled or caught
                        on the net.
                        2. Bail any water out of boat and grass.
                        3. Slush bags are tied up with brown braillers inside and tied up with tag line in rail bar.
                        4. Buckets and bailers put back where they belong.
                        5. When boat driver is ready, throw the bouy over holding on to the boat line on bow and start pulling the boat
                        out.
                        6. Listen to the boat driver when to drop the line
                        7. One person up front watching and directing driver from bouys, drifters, drifters nets, debrea, when to turn in to the nets, etc.

                        Going up to the net.
                        Incoming tide usually upriver depending on the weather / current.
                        Outgoing tide usually downriver depending on the weather / current.
                        Gaff is given to the person in the bow to grab the net.
                        Bow person is calling out the distance from the net so the driver can hear
                        2/3 people are up on the ice tote ready to pull up the cork line over the bow, then the lead line over the bow. 
                        While the net is being pulled up the driver has turned off the motor, lifted it up and started the roller motor.
                        everyone helps pull the net back over the rollers (posts are placed) and roller MUST be lifted my 2 people and then pin put in.
                        Incoming tide - corks upriver
                        Out going tide - corks down river
                        Everyone  quickly spreads the net and starts picking any fish in the boat. If we are bleeding, bleed fish - both sides and place
                        in brown brailler we are starting with.
                        Roller operator will either say pass (which means the fish will be passed to the person behind and the new fish coming up will be
                        picked by everyone)
                        As soon as the fish is out, call clear and roller is turned on.
                        Everyone MUST pull on the net. The roller is only there to help, you must pull on the net.
                        When the fish are to the second person, call out stop and start picking quickly. As soon as the fish are cleared, call
                        out clear and start the roller. There is not time to wait, as soon as the fish are out, move to the next fish(s). 
                        This must be done quickly and with speed to get through the nets before slack water, usually deliver and back to pick quickly
                        with speed after the change of tide, deliver or boat line depending on amount of fish and time. When it is bush, you will pick
                        until full, deliver, pick, deliver, etc.

                        Between Nets:
                        Everyone helps, No one stands around:
                        1. Fish need to be bled and put in braillers
                        2. Flounders are thrown out once outside the net and running lines and turned to go to next net
                        3. Grass and etc is thrown out
                        4. Water bailed and buckets and bailers are put away when coming up on next net

                        Before Pulling From the Boat:
                        When it is time to pick and pull, you will pick through the nets, drop off 2 people to go and help pull.
                        The 3 left will pick that net out, go back to pick through the first net and drop off as they pull it in. The boat will go to
                        the next net start in, get out and pick any fish on shore, drop 2 people off if you haven't yet to go down and pull while the other 3 pick out,
                        drop the lead line until they are headed down, then pick in pick up any fish, then go deliver.

                        On the way to tender:
                        Everyone helps, No one stands around:
                        1. All fish bled and put in brailler
                        2. Grass, flounders, etc is thrown out
                        3. Boat is bailed
                        4. Splash down and bailed
                        5. Everything MUSH be off the floor of the boat, boat must be neat and clean
                        6. Fish iced, braillers splashed down with water, small mount of water pored over ice chuncks on fish, some 
                        ice chunks in slush bags

                        At Tender:
                        No one is to be on the tender except to get ice.
                        1. Grad a bouy of tender and bow of boat is tied off, stren line if needed- NEVER use are ropes, Always use the tenders ropes/lines
                        2. Pellicans are hooked up with tag line attached
                        3. Brown braillers are untied
                        4. Pellican attached to scale
                        5. Slush bags are empty every time
                        6. Ice tote is filled and some in slush bag if hot or picking again
                        7. Bucket is fill with ice and put in the back
                        8. Braillers are tied off then dipped and rinced 
                        9. Braillers are put back into empty slush bags and tied up
                        10 Boat is splashed down and bailed
                        11. Buckets, bailers, etc. are put away
                        12. Pipes are put in correct holes for pulling in the net

                        Pulling:
                        When the fishing period is over the nets are pulled in by the tractor, everyone has a job or 2 to do. No standing around, husal
                        from place to place. 
                        -Feed the running out from the downriver post in sequence with the tractor pulling
                        -Tie the rope from the tractor to the net
                        -Stand on the corks as the rope is being untied
                        -Pick fish at the water edge and put in sled
                        -Depending on the fishing anounment the net will be flaked into a tote or flaked on the ground. Corks always are on the upriver side.
                        -Spreader bars are tied together or with the pull back line depending on the announcmant
                        -Safetys are put on both lines (upriver and downriver)
                        -Ropes are figured 8 high on bank
                        -Sleds are rinced and placed high on bank with 2 large rocks in them
                        -Trailers are hooked to 4-wheeler(s) and brought up top
                        -Snatch block is hung on post with pin locked down
                        -Double check knots, safetys, and block

                        Beach Fish Run:
                        -All fish are washed and cleaned by #1 site
                        -Clean fish are put in brailler, tied together

                        After Pull Up on Top:
                        -Generator is started and then water pump switch is turned on
                        -Gear is rinced off
                        -4-wheelers are rinced off
                        -Trailers are rinced out
                        -Brailers are rinced out
                        -Generator and water pump turned off when finished, don't leave it running
                        
                    </p>
                </div>
                <figure class="fishing__img--wrapper">
                    <img src="./assets/fishing.jpg" alt="fishing">
                </figure>
            </div>

         <section id="cleanup">
            <h2>Cleanup Beach Gear End of Season</h2>
            <div class="row">
            <div class="section_discription--cleanup:">
                <div class="section_discription--cleanup--wrapper">
                    <p class="section_discription---cleanup--para"></p>
                    <p>At the end of the fishing season all gear needs to be "pulled", marked with corks, etc.
                        -Nets are either put in totes or net bags to be shipped home to be fixed after they have been washed and cleaned
                        -Net bags going home need to be tied a certain way and labeled to take across
                        -Downriver running line is hooked up through the snatch block and tied to the tractor (This may change due to tide and weather)
                        -Upriver post line is untied to feed out (This may change due to tide and weather)
                        -Outside steak is marked with several cork lines and pully and board are taken off
                        -Side stake is marked with several cork lines and pully ad bard are taken off
                        -Running line is coiled into tote
                        -Hall back rope/line, extra rope/line, safety ropes/lines, block ropes/lines are all put in the same tote for that site
                        -labled and stacked in mending room
                        -Spreader bars sprayed off
                        -Blocks and boards are sprayed off
                        -Blocks are greased and hung in oil drum
                        -Boards are put up next to shop
                        -Greats are stacked by mending room
                        -Red metal bouy brought up to mending room
                        -If there is a spruse anchor out, it needs to be picked up, rinced and put in processing room

                        Creates to Go Home:
                        -Everything that isn't going on the plane needs to go in the creates to be shipped home.
                        -Empty propane bottles
                        -All no burnable trash
                        -Personal items
                        -Broken items (Such as: tools, bars, equipment, etc.)
                        -Etc.
                    </p>
                </div>
                <figure class="cleanup__img--wrapper">
                    <img src="./assets/cleanuup.jpg" alt="Cleanup">
                </figure>
            </div>
